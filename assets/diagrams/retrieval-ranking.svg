<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" width="820" height="300" font-family="Nunito,'Segoe UI',Helvetica,Arial,sans-serif" role="img" aria-labelledby="t d"><title id="t">Recommender pipeline: retrieval then ranking</title><desc id="d">Retrieval generates many plausible candidates, they are combined with duplicates and watched items removed, then ranked by the learned model and displayed.</desc><defs><marker id="ahAAA9BB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#AAA9BB"/></marker></defs><rect width="820" height="300" rx="16" fill="#171821"/><rect x="20.0" y="70.0" width="170" height="90" rx="12" fill="#2C2B40" stroke="#A78BFA" stroke-width="2"/><text x="105" y="120.95" font-size="17" fill="#F1EFF7" text-anchor="middle" font-weight="400"><tspan x="105" dy="0">Retrieval</tspan></text><text x="105" y="197.0" font-size="12" fill="#AAA9BB" text-anchor="middle" font-weight="400"><tspan x="105" dy="0">generate a large list of</tspan><tspan x="105" dy="14.399999999999999">plausible item candidates</tspan></text><rect x="220.0" y="70.0" width="170" height="90" rx="12" fill="#2C2B40" stroke="#91C7A5" stroke-width="2"/><text x="305" y="120.95" font-size="17" fill="#F1EFF7" text-anchor="middle" font-weight="400"><tspan x="305" dy="0">Combine</tspan></text><text x="305" y="197.0" font-size="12" fill="#AAA9BB" text-anchor="middle" font-weight="400"><tspan x="305" dy="0">remove duplicates and</tspan><tspan x="305" dy="14.399999999999999">items already watched</tspan></text><line x1="215" y1="115" x2="220" y2="115" stroke="#AAA9BB" stroke-width="2" marker-end="url(#ahAAA9BB)"/><rect x="420.0" y="70.0" width="170" height="90" rx="12" fill="#2C2B40" stroke="#E89BB5" stroke-width="2"/><text x="505" y="120.95" font-size="17" fill="#F1EFF7" text-anchor="middle" font-weight="400"><tspan x="505" dy="0">Ranking</tspan></text><text x="505" y="197.0" font-size="12" fill="#AAA9BB" text-anchor="middle" font-weight="400"><tspan x="505" dy="0">rank the list using the</tspan><tspan x="505" dy="14.399999999999999">learned model (neural net)</tspan></text><line x1="415" y1="115" x2="420" y2="115" stroke="#AAA9BB" stroke-width="2" marker-end="url(#ahAAA9BB)"/><rect x="620.0" y="70.0" width="170" height="90" rx="12" fill="#2C2B40" stroke="#EAC477" stroke-width="2"/><text x="705" y="120.95" font-size="17" fill="#F1EFF7" text-anchor="middle" font-weight="400"><tspan x="705" dy="0">Display</tspan></text><text x="705" y="204.2" font-size="12" fill="#AAA9BB" text-anchor="middle" font-weight="400"><tspan x="705" dy="0">show ranked items</tspan></text><line x1="615" y1="115" x2="620" y2="115" stroke="#AAA9BB" stroke-width="2" marker-end="url(#ahAAA9BB)"/><text x="105" y="252.0" font-size="12" fill="#EAC477" text-anchor="middle" font-weight="400"><tspan x="105" dy="0">e.g. similar to each of the last 10</tspan><tspan x="105" dy="14.399999999999999">watched movies; top 20 in country</tspan></text></svg>