<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" width="820" height="380" font-family="Nunito,'Segoe UI',Helvetica,Arial,sans-serif" role="img" aria-labelledby="t d"><title id="t">Data splits for anomaly detection (aircraft engines)</title><desc id="d">10000 good and 20 flawed engines split into training, cross-validation and test sets, or alternatively training and cross-validation only.</desc><defs></defs><rect width="820" height="380" rx="16" fill="#171821"/><text x="20" y="50.55" font-size="13" fill="#EAC477" text-anchor="start" font-weight="400"><tspan x="20" dy="0">10000 good engines (y=0), 20 flawed engines (y=1)</tspan></text><rect x="24.0" y="60.0" width="292" height="60" rx="12" fill="#2C2B40" stroke="#A78BFA" stroke-width="2"/><text x="170.0" y="86.75" font-size="13" fill="#F1EFF7" text-anchor="middle" font-weight="400"><tspan x="170.0" dy="0">Training set</tspan><tspan x="170.0" dy="15.6">6000 good engines</tspan></text><rect x="324.0" y="60.0" width="242" height="60" rx="12" fill="#2C2B40" stroke="#91C7A5" stroke-width="2"/><text x="445.0" y="78.95" font-size="13" fill="#F1EFF7" text-anchor="middle" font-weight="400"><tspan x="445.0" dy="0">CV set</tspan><tspan x="445.0" dy="15.6">2000 good (y=0)</tspan><tspan x="445.0" dy="15.6">10 anomalous (y=1)</tspan></text><rect x="574.0" y="60.0" width="242" height="60" rx="12" fill="#2C2B40" stroke="#E89BB5" stroke-width="2"/><text x="695.0" y="78.95" font-size="13" fill="#F1EFF7" text-anchor="middle" font-weight="400"><tspan x="695.0" dy="0">Test set</tspan><tspan x="695.0" dy="15.6">2000 good (y=0)</tspan><tspan x="695.0" dy="15.6">10 anomalous (y=1)</tspan></text><text x="20" y="210.55" font-size="13" fill="#EAC477" text-anchor="start" font-weight="400"><tspan x="20" dy="0">Alternative: no test set (if very few anomalies)</tspan></text><rect x="24.0" y="220.0" width="292" height="60" rx="12" fill="#2C2B40" stroke="#A78BFA" stroke-width="2"/><text x="170.0" y="246.75" font-size="13" fill="#F1EFF7" text-anchor="middle" font-weight="400"><tspan x="170.0" dy="0">Training set</tspan><tspan x="170.0" dy="15.6">6000 good engines</tspan></text><rect x="324.0" y="220.0" width="492" height="60" rx="12" fill="#2C2B40" stroke="#91C7A5" stroke-width="2"/><text x="570.0" y="246.75" font-size="13" fill="#F1EFF7" text-anchor="middle" font-weight="400"><tspan x="570.0" dy="0">CV set</tspan><tspan x="570.0" dy="15.6">4000 good (y=0), 20 anomalous (y=1)</tspan></text><text x="420" y="334.55" font-size="13" fill="#AAA9BB" text-anchor="middle" font-weight="400"><tspan x="420" dy="0">use the CV set to tune ε and the features xⱼ</tspan></text><text x="420" y="356.2" font-size="12" fill="#AAA9BB" text-anchor="middle" font-weight="400"><tspan x="420" dy="0">alternative carries a higher risk of overfitting</tspan></text></svg>