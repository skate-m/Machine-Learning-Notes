<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 250" width="780" height="250" font-family="Nunito,'Segoe UI',Helvetica,Arial,sans-serif" role="img" aria-labelledby="t d"><title id="t">Backpropagation versus gradient descent</title><desc id="d">Backpropagation computes gradients with the chain rule; gradient descent uses them to update weights and biases.</desc><defs><marker id="ahAAA9BB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#AAA9BB"/></marker></defs><rect width="780" height="250" rx="16" fill="#171821"/><rect x="35.0" y="65.0" width="170" height="70" rx="12" fill="#2C2B40" stroke="#AAA9BB" stroke-width="2"/><text x="120" y="105.25" font-size="15" fill="#F1EFF7" text-anchor="middle" font-weight="400"><tspan x="120" dy="0">Loss / cost J</tspan></text><line x1="205" y1="100" x2="265" y2="100" stroke="#AAA9BB" stroke-width="2" marker-end="url(#ahAAA9BB)"/><rect x="275.0" y="55.0" width="230" height="90" rx="12" fill="#2C2B40" stroke="#A78BFA" stroke-width="2"/><text x="390" y="88.95" font-size="13" fill="#F1EFF7" text-anchor="middle" font-weight="400"><tspan x="390" dy="0">Backpropagation</tspan><tspan x="390" dy="15.6">backward error propagation</tspan><tspan x="390" dy="15.6">(chain rule)</tspan></text><line x1="506" y1="100" x2="566" y2="100" stroke="#AAA9BB" stroke-width="2" marker-end="url(#ahAAA9BB)"/><text x="536" y="84.2" font-size="12" fill="#EAC477" text-anchor="middle" font-weight="400"><tspan x="536" dy="0">gradients</tspan></text><rect x="570.0" y="55.0" width="180" height="90" rx="12" fill="#2C2B40" stroke="#91C7A5" stroke-width="2"/><text x="660" y="88.95" font-size="13" fill="#F1EFF7" text-anchor="middle" font-weight="400"><tspan x="660" dy="0">Gradient descent</tspan><tspan x="660" dy="15.6">updates weights</tspan><tspan x="660" dy="15.6">and biases</tspan></text><path d="M660,150 C660,225 120,225 120,138" fill="none" stroke="#AAA9BB" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ahAAA9BB)"/><text x="390" y="236.2" font-size="12" fill="#AAA9BB" text-anchor="middle" font-weight="400"><tspan x="390" dy="0">repeat: iteratively step down the loss surface</tspan></text></svg>