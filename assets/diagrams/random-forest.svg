<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 360" width="780" height="360" font-family="Nunito,'Segoe UI',Helvetica,Arial,sans-serif" role="img" aria-labelledby="t d"><title id="t">Random forest ensemble</title><desc id="d">Training set of size m is resampled with replacement B times; a decision tree is trained on each new set and the trees vote.</desc><defs><marker id="ahAAA9BB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#AAA9BB"/></marker></defs><rect width="780" height="360" rx="16" fill="#171821"/><rect x="25.0" y="135.0" width="130" height="90" rx="12" fill="#2C2B40" stroke="#A78BFA" stroke-width="2"/><text x="90" y="176.25" font-size="15" fill="#F1EFF7" text-anchor="middle" font-weight="400"><tspan x="90" dy="0">Training set</tspan><tspan x="90" dy="18.0">size m</tspan></text><line x1="155" y1="180" x2="238" y2="60" stroke="#AAA9BB" stroke-width="2" marker-end="url(#ahAAA9BB)"/><rect x="240.0" y="33.0" width="120" height="54" rx="12" fill="#2C2B40" stroke="#91C7A5" stroke-width="2"/><text x="300" y="56.75" font-size="13" fill="#F1EFF7" text-anchor="middle" font-weight="400"><tspan x="300" dy="0">new set</tspan><tspan x="300" dy="15.6">size m</tspan></text><line x1="360" y1="60" x2="420" y2="60" stroke="#AAA9BB" stroke-width="2" marker-end="url(#ahAAA9BB)"/><rect x="425.0" y="33.0" width="110" height="54" rx="12" fill="#2C2B40" stroke="#E89BB5" stroke-width="2"/><text x="480" y="65.25" font-size="15" fill="#F1EFF7" text-anchor="middle" font-weight="400"><tspan x="480" dy="0">Tree 1</tspan></text><line x1="535" y1="60" x2="598" y2="180" stroke="#AAA9BB" stroke-width="2" marker-end="url(#ahAAA9BB)"/><line x1="155" y1="180" x2="238" y2="140" stroke="#AAA9BB" stroke-width="2" marker-end="url(#ahAAA9BB)"/><rect x="240.0" y="113.0" width="120" height="54" rx="12" fill="#2C2B40" stroke="#91C7A5" stroke-width="2"/><text x="300" y="136.75" font-size="13" fill="#F1EFF7" text-anchor="middle" font-weight="400"><tspan x="300" dy="0">new set</tspan><tspan x="300" dy="15.6">size m</tspan></text><line x1="360" y1="140" x2="420" y2="140" stroke="#AAA9BB" stroke-width="2" marker-end="url(#ahAAA9BB)"/><rect x="425.0" y="113.0" width="110" height="54" rx="12" fill="#2C2B40" stroke="#E89BB5" stroke-width="2"/><text x="480" y="145.25" font-size="15" fill="#F1EFF7" text-anchor="middle" font-weight="400"><tspan x="480" dy="0">Tree 2</tspan></text><line x1="535" y1="140" x2="598" y2="180" stroke="#AAA9BB" stroke-width="2" marker-end="url(#ahAAA9BB)"/><line x1="155" y1="180" x2="238" y2="300" stroke="#AAA9BB" stroke-width="2" marker-end="url(#ahAAA9BB)"/><rect x="240.0" y="273.0" width="120" height="54" rx="12" fill="#2C2B40" stroke="#91C7A5" stroke-width="2"/><text x="300" y="296.75" font-size="13" fill="#F1EFF7" text-anchor="middle" font-weight="400"><tspan x="300" dy="0">new set</tspan><tspan x="300" dy="15.6">size m</tspan></text><line x1="360" y1="300" x2="420" y2="300" stroke="#AAA9BB" stroke-width="2" marker-end="url(#ahAAA9BB)"/><rect x="425.0" y="273.0" width="110" height="54" rx="12" fill="#2C2B40" stroke="#E89BB5" stroke-width="2"/><text x="480" y="305.25" font-size="15" fill="#F1EFF7" text-anchor="middle" font-weight="400"><tspan x="480" dy="0">Tree B</tspan></text><line x1="535" y1="300" x2="598" y2="180" stroke="#AAA9BB" stroke-width="2" marker-end="url(#ahAAA9BB)"/><circle cx="300" cy="214" r="2" fill="#AAA9BB" stroke="#AAA9BB" stroke-width="0"/><circle cx="300" cy="222" r="2" fill="#AAA9BB" stroke="#AAA9BB" stroke-width="0"/><circle cx="300" cy="230" r="2" fill="#AAA9BB" stroke="#AAA9BB" stroke-width="0"/><circle cx="480" cy="214" r="2" fill="#AAA9BB" stroke="#AAA9BB" stroke-width="0"/><circle cx="480" cy="222" r="2" fill="#AAA9BB" stroke="#AAA9BB" stroke-width="0"/><circle cx="480" cy="230" r="2" fill="#AAA9BB" stroke="#AAA9BB" stroke-width="0"/><text x="196" y="24.2" font-size="12" fill="#EAC477" text-anchor="middle" font-weight="400"><tspan x="196" dy="0">sampling with replacement</tspan></text><rect x="600.0" y="135.0" width="140" height="90" rx="12" fill="#2C2B40" stroke="#EAC477" stroke-width="2"/><text x="670" y="176.25" font-size="15" fill="#F1EFF7" text-anchor="middle" font-weight="400"><tspan x="670" dy="0">vote on</tspan><tspan x="670" dy="18.0">final decision</tspan></text><text x="390" y="349.2" font-size="12" fill="#AAA9BB" text-anchor="middle" font-weight="400"><tspan x="390" dy="0">at each node: pick random subset of K &lt; n features (ideally K = √n), choose the best split from those K</tspan></text></svg>