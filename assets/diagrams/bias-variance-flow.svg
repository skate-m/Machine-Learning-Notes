<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 360" width="780" height="360" font-family="Nunito,'Segoe UI',Helvetica,Arial,sans-serif" role="img" aria-labelledby="t d"><title id="t">Bias/variance workflow for neural networks</title><desc id="d">If the network does poorly on the training set use a bigger network; if poorly on the cross validation set get more data; otherwise done.</desc><defs><marker id="ahAAA9BB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#AAA9BB"/></marker></defs><rect width="780" height="360" rx="16" fill="#171821"/><rect x="45.0" y="35.0" width="210" height="70" rx="12" fill="#2C2B40" stroke="#A78BFA" stroke-width="2"/><text x="150" y="66.5" font-size="14" fill="#F1EFF7" text-anchor="middle" font-weight="400"><tspan x="150" dy="0">Does it do well</tspan><tspan x="150" dy="16.8">on training set?</tspan></text><rect x="355.0" y="35.0" width="230" height="70" rx="12" fill="#2C2B40" stroke="#A78BFA" stroke-width="2"/><text x="470" y="66.5" font-size="14" fill="#F1EFF7" text-anchor="middle" font-weight="400"><tspan x="470" dy="0">Does it do well on</tspan><tspan x="470" dy="16.8">cross validation set?</tspan></text><line x1="255" y1="70" x2="355" y2="70" stroke="#AAA9BB" stroke-width="2" marker-end="url(#ahAAA9BB)"/><text x="305" y="59.55" font-size="13" fill="#91C7A5" text-anchor="middle" font-weight="400"><tspan x="305" dy="0">Yes</tspan></text><ellipse cx="150" cy="250" rx="80" ry="34" fill="#2C2B40" stroke="#E89BB5" stroke-width="2"/><text x="150" y="246.25" font-size="15" fill="#F1EFF7" text-anchor="middle" font-weight="400"><tspan x="150" dy="0">Bigger</tspan><tspan x="150" dy="18.0">network</tspan></text><line x1="150" y1="105" x2="150" y2="214" stroke="#AAA9BB" stroke-width="2" marker-end="url(#ahAAA9BB)"/><text x="168" y="164.55" font-size="13" fill="#E89BB5" text-anchor="start" font-weight="400"><tspan x="168" dy="0">No</tspan></text><ellipse cx="400" cy="250" rx="80" ry="34" fill="#2C2B40" stroke="#E89BB5" stroke-width="2"/><text x="400" y="246.25" font-size="15" fill="#F1EFF7" text-anchor="middle" font-weight="400"><tspan x="400" dy="0">More</tspan><tspan x="400" dy="18.0">data</tspan></text><line x1="440" y1="105" x2="420" y2="216" stroke="#AAA9BB" stroke-width="2" marker-end="url(#ahAAA9BB)"/><text x="446" y="164.55" font-size="13" fill="#E89BB5" text-anchor="start" font-weight="400"><tspan x="446" dy="0">No</tspan></text><ellipse cx="690" cy="250" rx="70" ry="34" fill="#2C2B40" stroke="#91C7A5" stroke-width="2"/><text x="690" y="255.6" font-size="16" fill="#F1EFF7" text-anchor="middle" font-weight="400"><tspan x="690" dy="0">Done!</tspan></text><line x1="585" y1="70" x2="690" y2="70" stroke="#AAA9BB" stroke-width="2"/><line x1="690" y1="70" x2="690" y2="214" stroke="#AAA9BB" stroke-width="2" marker-end="url(#ahAAA9BB)"/><text x="670" y="154.55" font-size="13" fill="#91C7A5" text-anchor="end" font-weight="400"><tspan x="670" dy="0">Yes</tspan></text><path d="M70,250 L40,250 L40,70 L45,70" fill="none" stroke="#AAA9BB" stroke-width="2" marker-end="url(#ahAAA9BB)"/><line x1="70" y1="250" x2="70" y2="250" stroke="#AAA9BB" stroke-width="2"/><path d="M400,284 L400,325 L40,325 L40,250" fill="none" stroke="#AAA9BB" stroke-width="2"/><text x="390" y="349.2" font-size="12" fill="#AAA9BB" text-anchor="middle" font-weight="400"><tspan x="390" dy="0">repeat the loop after each change</tspan></text></svg>