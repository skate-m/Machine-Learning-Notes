<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" width="640" height="230" font-family="Nunito,'Segoe UI',Helvetica,Arial,sans-serif" role="img" aria-labelledby="t d"><title id="t">State-action value Q(2, left)</title><desc id="d">Four states; terminal rewards 100 and 40; from state 2 going left reaches state 1 with reward 100, so Q(2, left) = 0 + 0.5 x 100 = 50.</desc><defs><marker id="ah91C7A5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#91C7A5"/></marker></defs><rect width="640" height="230" rx="16" fill="#171821"/><rect x="40" y="70" width="140" height="90" rx="12" fill="#2C2B40" stroke="#A78BFA" stroke-width="2"/><text x="110" y="123.4" font-size="24" fill="#EAC477" text-anchor="middle" font-weight="400"><tspan x="110" dy="0">100</tspan></text><text x="110" y="189.55" font-size="13" fill="#AAA9BB" text-anchor="middle" font-weight="400"><tspan x="110" dy="0">state 1</tspan></text><rect x="180" y="70" width="140" height="90" rx="12" fill="#2C2B40" stroke="#A78BFA" stroke-width="2"/><text x="250" y="123.4" font-size="24" fill="#F1EFF7" text-anchor="middle" font-weight="400"><tspan x="250" dy="0"></tspan></text><text x="250" y="189.55" font-size="13" fill="#AAA9BB" text-anchor="middle" font-weight="400"><tspan x="250" dy="0">state 2</tspan></text><rect x="320" y="70" width="140" height="90" rx="12" fill="#2C2B40" stroke="#A78BFA" stroke-width="2"/><text x="390" y="123.4" font-size="24" fill="#F1EFF7" text-anchor="middle" font-weight="400"><tspan x="390" dy="0"></tspan></text><text x="390" y="189.55" font-size="13" fill="#AAA9BB" text-anchor="middle" font-weight="400"><tspan x="390" dy="0">state 3</tspan></text><rect x="460" y="70" width="140" height="90" rx="12" fill="#2C2B40" stroke="#A78BFA" stroke-width="2"/><text x="530" y="123.4" font-size="24" fill="#EAC477" text-anchor="middle" font-weight="400"><tspan x="530" dy="0">40</tspan></text><text x="530" y="189.55" font-size="13" fill="#AAA9BB" text-anchor="middle" font-weight="400"><tspan x="530" dy="0">state 4</tspan></text><line x1="250" y1="140" x2="190" y2="140" stroke="#91C7A5" stroke-width="2" marker-end="url(#ah91C7A5)"/><line x1="390" y1="140" x2="330" y2="140" stroke="#91C7A5" stroke-width="2" marker-end="url(#ah91C7A5)"/><text x="180" y="55.6" font-size="16" fill="#91C7A5" text-anchor="start" font-weight="400"><tspan x="180" dy="0">Q(2, ←) = 0 + (0.5) · 100 = 50</tspan></text></svg>