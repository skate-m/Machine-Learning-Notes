<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" width="760" height="260" font-family="Nunito,'Segoe UI',Helvetica,Arial,sans-serif" role="img" aria-labelledby="t d"><title id="t">Deployment: inference server and mobile app</title><desc id="d">The mobile app sends an API call with x (an audio clip) to an inference server running the ML model; the server returns the inference y-hat (a text transcript).</desc><defs><marker id="ahEAC477" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#EAC477"/></marker><marker id="ah91C7A5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#91C7A5"/></marker></defs><rect width="760" height="260" rx="16" fill="#171821"/><rect x="40" y="40" width="280" height="180" rx="12" fill="#2C2B40" stroke="#A78BFA" stroke-width="2"/><text x="180" y="67.25" font-size="15" fill="#F1EFF7" text-anchor="middle" font-weight="400"><tspan x="180" dy="0">Inference server</tspan></text><rect x="105.0" y="115.0" width="150" height="70" rx="12" fill="#2C2B40" stroke="#91C7A5" stroke-width="2"/><text x="180" y="155.25" font-size="15" fill="#F1EFF7" text-anchor="middle" font-weight="400"><tspan x="180" dy="0">ML model</tspan></text><rect x="470" y="40" width="250" height="180" rx="12" fill="#2C2B40" stroke="#E89BB5" stroke-width="2"/><text x="595" y="135.6" font-size="16" fill="#F1EFF7" text-anchor="middle" font-weight="400"><tspan x="595" dy="0">Mobile app</tspan></text><line x1="470" y1="85" x2="320" y2="85" stroke="#EAC477" stroke-width="2" marker-end="url(#ahEAC477)"/><text x="395" y="64.55" font-size="13" fill="#EAC477" text-anchor="middle" font-weight="400"><tspan x="395" dy="0">API call (x)</tspan></text><text x="395" y="106.2" font-size="12" fill="#AAA9BB" text-anchor="middle" font-weight="400"><tspan x="395" dy="0">(audio clip)</tspan></text><line x1="320" y1="175" x2="470" y2="175" stroke="#91C7A5" stroke-width="2" marker-end="url(#ah91C7A5)"/><text x="395" y="154.55" font-size="13" fill="#91C7A5" text-anchor="middle" font-weight="400"><tspan x="395" dy="0">Inference (ŷ)</tspan></text><text x="395" y="196.2" font-size="12" fill="#AAA9BB" text-anchor="middle" font-weight="400"><tspan x="395" dy="0">(text transcript)</tspan></text></svg>