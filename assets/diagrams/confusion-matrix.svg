<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" width="540" height="400" font-family="Nunito,'Segoe UI',Helvetica,Arial,sans-serif" role="img" aria-labelledby="t d"><title id="t">Confusion matrix for precision and recall</title><desc id="d">Rows are predicted 1 or 0, columns are actual 1 or 0: true positive, false positive, false negative, true negative.</desc><defs></defs><rect width="540" height="400" rx="16" fill="#171821"/><text x="340" y="39.25" font-size="15" fill="#EAC477" text-anchor="middle" font-weight="400"><tspan x="340" dy="0">Actual</tspan></text><text x="255" y="69.25" font-size="15" fill="#F1EFF7" text-anchor="middle" font-weight="400"><tspan x="255" dy="0">1</tspan></text><text x="425" y="69.25" font-size="15" fill="#F1EFF7" text-anchor="middle" font-weight="400"><tspan x="425" dy="0">0</tspan></text><text x="60" y="205.25" font-size="15" fill="#EAC477" text-anchor="middle" font-weight="400"><tspan x="60" dy="0">Predicted</tspan></text><text x="150" y="155.25" font-size="15" fill="#F1EFF7" text-anchor="middle" font-weight="400"><tspan x="150" dy="0">1</tspan></text><text x="150" y="295.25" font-size="15" fill="#F1EFF7" text-anchor="middle" font-weight="400"><tspan x="150" dy="0">0</tspan></text><rect x="170" y="80" width="170" height="140" rx="12" fill="#2C2B40" stroke="#91C7A5" stroke-width="2"/><text x="255" y="145.75" font-size="17" fill="#F1EFF7" text-anchor="middle" font-weight="400"><tspan x="255" dy="0">True</tspan><tspan x="255" dy="20.4">Positive</tspan></text><rect x="340" y="80" width="170" height="140" rx="12" fill="#2C2B40" stroke="#E89BB5" stroke-width="2"/><text x="425" y="145.75" font-size="17" fill="#F1EFF7" text-anchor="middle" font-weight="400"><tspan x="425" dy="0">False</tspan><tspan x="425" dy="20.4">Positive</tspan></text><rect x="170" y="220" width="170" height="140" rx="12" fill="#2C2B40" stroke="#E89BB5" stroke-width="2"/><text x="255" y="285.75" font-size="17" fill="#F1EFF7" text-anchor="middle" font-weight="400"><tspan x="255" dy="0">False</tspan><tspan x="255" dy="20.4">Negative</tspan></text><rect x="340" y="220" width="170" height="140" rx="12" fill="#2C2B40" stroke="#91C7A5" stroke-width="2"/><text x="425" y="285.75" font-size="17" fill="#F1EFF7" text-anchor="middle" font-weight="400"><tspan x="425" dy="0">True</tspan><tspan x="425" dy="20.4">Negative</tspan></text></svg>