<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 260" width="780" height="260" font-family="Nunito,'Segoe UI',Helvetica,Arial,sans-serif" role="img" aria-labelledby="t d"><title id="t">Image recognition: features learned layer by layer</title><desc id="d">Face image passes through layers that detect lines and patterns, then parts like eyes and nose, then possible faces.</desc><defs><marker id="ahAAA9BB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#AAA9BB"/></marker></defs><rect width="780" height="260" rx="16" fill="#171821"/><rect x="15.0" y="75.0" width="150" height="100" rx="12" fill="#2C2B40" stroke="#AAA9BB" stroke-width="2"/><text x="90" y="121.5" font-size="14" fill="#F1EFF7" text-anchor="middle" font-weight="400"><tspan x="90" dy="0">face image</tspan><tspan x="90" dy="16.8">(input)</tspan></text><rect x="195.0" y="75.0" width="150" height="100" rx="12" fill="#2C2B40" stroke="#A78BFA" stroke-width="2"/><text x="270" y="121.5" font-size="14" fill="#F1EFF7" text-anchor="middle" font-weight="400"><tspan x="270" dy="0">1st hidden layer</tspan><tspan x="270" dy="16.8">lines and patterns</tspan></text><rect x="405.0" y="75.0" width="150" height="100" rx="12" fill="#2C2B40" stroke="#91C7A5" stroke-width="2"/><text x="480" y="121.5" font-size="14" fill="#F1EFF7" text-anchor="middle" font-weight="400"><tspan x="480" dy="0">2nd hidden layer</tspan><tspan x="480" dy="16.8">eyes, nose, …</tspan></text><rect x="615.0" y="75.0" width="150" height="100" rx="12" fill="#2C2B40" stroke="#E89BB5" stroke-width="2"/><text x="690" y="121.5" font-size="14" fill="#F1EFF7" text-anchor="middle" font-weight="400"><tspan x="690" dy="0">3rd hidden layer</tspan><tspan x="690" dy="16.8">possible faces</tspan></text><line x1="165" y1="125" x2="195" y2="125" stroke="#AAA9BB" stroke-width="2" marker-end="url(#ahAAA9BB)"/><line x1="345" y1="125" x2="405" y2="125" stroke="#AAA9BB" stroke-width="2" marker-end="url(#ahAAA9BB)"/><line x1="555" y1="125" x2="615" y2="125" stroke="#AAA9BB" stroke-width="2" marker-end="url(#ahAAA9BB)"/><text x="390" y="224.55" font-size="13" fill="#AAA9BB" text-anchor="middle" font-weight="400"><tspan x="390" dy="0">earlier layers detect simple patterns; later layers combine them</tspan></text></svg>