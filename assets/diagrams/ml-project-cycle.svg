<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" width="820" height="300" font-family="Nunito,'Segoe UI',Helvetica,Arial,sans-serif" role="img" aria-labelledby="t d"><title id="t">Cycle of an ML project</title><desc id="d">Scope project, collect data, train model, deploy in production, with arrows returning to earlier stages.</desc><defs><marker id="ahAAA9BB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#AAA9BB"/></marker></defs><rect width="820" height="300" rx="16" fill="#171821"/><polygon points="40,110 190,110 225,160 190,210 40,210 75,160" fill="#2C2B40" stroke="#A78BFA" stroke-width="2"/><text x="135" y="156.0" font-size="16" fill="#F1EFF7" text-anchor="middle" font-weight="400"><tspan x="135" dy="0">Scope</tspan><tspan x="135" dy="19.2">project</tspan></text><text x="135" y="249.2" font-size="12" fill="#AAA9BB" text-anchor="middle" font-weight="400"><tspan x="135" dy="0">Define project</tspan></text><polygon points="235,110 385,110 420,160 385,210 235,210 270,160" fill="#2C2B40" stroke="#91C7A5" stroke-width="2"/><text x="330" y="156.0" font-size="16" fill="#F1EFF7" text-anchor="middle" font-weight="400"><tspan x="330" dy="0">Collect</tspan><tspan x="330" dy="19.2">Data</tspan></text><polygon points="430,110 580,110 615,160 580,210 430,210 465,160" fill="#2C2B40" stroke="#E89BB5" stroke-width="2"/><text x="525" y="156.0" font-size="16" fill="#F1EFF7" text-anchor="middle" font-weight="400"><tspan x="525" dy="0">Train</tspan><tspan x="525" dy="19.2">Model</tspan></text><text x="525" y="242.0" font-size="12" fill="#AAA9BB" text-anchor="middle" font-weight="400"><tspan x="525" dy="0">Training, error analysis</tspan><tspan x="525" dy="14.399999999999999">and iterative improvement</tspan></text><polygon points="625,110 775,110 810,160 775,210 625,210 660,160" fill="#2C2B40" stroke="#EAC477" stroke-width="2"/><text x="720" y="156.0" font-size="16" fill="#F1EFF7" text-anchor="middle" font-weight="400"><tspan x="720" dy="0">Deploy in</tspan><tspan x="720" dy="19.2">production</tspan></text><text x="720" y="242.0" font-size="12" fill="#AAA9BB" text-anchor="middle" font-weight="400"><tspan x="720" dy="0">Deploy, monitor and</tspan><tspan x="720" dy="14.399999999999999">maintain system</tspan></text><path d="M300,100 C300,50 130,50 130,100" fill="none" stroke="#AAA9BB" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ahAAA9BB)"/><path d="M495,100 C495,40 130,40 130,100" fill="none" stroke="#AAA9BB" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ahAAA9BB)"/><path d="M690,100 C690,30 300,30 300,100" fill="none" stroke="#AAA9BB" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ahAAA9BB)"/><text x="410" y="26.2" font-size="12" fill="#AAA9BB" text-anchor="middle" font-weight="400"><tspan x="410" dy="0">iterate: later stages send you back to earlier ones</tspan></text></svg>