<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" width="700" height="360" font-family="Nunito,'Segoe UI',Helvetica,Arial,sans-serif" role="img" aria-labelledby="t d"><title id="t">Iterative loop of ML development</title><desc id="d">Choose architecture (model, data, etc.), train model, run diagnostics (bias, variance and error analysis), then repeat.</desc><defs><marker id="ahAAA9BB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#AAA9BB"/></marker></defs><rect width="700" height="360" rx="16" fill="#171821"/><rect x="200.0" y="30.0" width="300" height="60" rx="12" fill="#2C2B40" stroke="#A78BFA" stroke-width="2"/><text x="350" y="56.5" font-size="14" fill="#F1EFF7" text-anchor="middle" font-weight="400"><tspan x="350" dy="0">Choose architecture</tspan><tspan x="350" dy="16.8">(model, data, etc.)</tspan></text><rect x="470.0" y="260.0" width="200" height="60" rx="12" fill="#2C2B40" stroke="#91C7A5" stroke-width="2"/><text x="570" y="286.5" font-size="14" fill="#F1EFF7" text-anchor="middle" font-weight="400"><tspan x="570" dy="0">Train</tspan><tspan x="570" dy="16.8">model</tspan></text><rect x="15.0" y="260.0" width="230" height="60" rx="12" fill="#2C2B40" stroke="#E89BB5" stroke-width="2"/><text x="130" y="286.75" font-size="13" fill="#F1EFF7" text-anchor="middle" font-weight="400"><tspan x="130" dy="0">Diagnostics</tspan><tspan x="130" dy="15.6">(bias, variance and error analysis)</tspan></text><path d="M470,85 C560,130 590,200 580,255" fill="none" stroke="#AAA9BB" stroke-width="2" marker-end="url(#ahAAA9BB)"/><path d="M470,300 L250,300" fill="none" stroke="#AAA9BB" stroke-width="2" marker-end="url(#ahAAA9BB)"/><path d="M120,258 C110,190 180,110 215,80" fill="none" stroke="#AAA9BB" stroke-width="2" marker-end="url(#ahAAA9BB)"/></svg>