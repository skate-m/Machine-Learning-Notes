<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 300" width="780" height="300" font-family="Nunito,'Segoe UI',Helvetica,Arial,sans-serif" role="img" aria-labelledby="t d"><title id="t">Transfer learning</title><desc id="d">Download pretrained network parameters, then further train the network on your own data.</desc><defs><marker id="ahEAC477" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#EAC477"/></marker><marker id="ahAAA9BB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#AAA9BB"/></marker></defs><rect width="780" height="300" rx="16" fill="#171821"/><rect x="30.0" y="65.0" width="200" height="70" rx="12" fill="#2C2B40" stroke="#A78BFA" stroke-width="2"/><text x="130" y="96.75" font-size="13" fill="#F1EFF7" text-anchor="middle" font-weight="400"><tspan x="130" dy="0">1. Download parameters</tspan><tspan x="130" dy="15.6">pretrained on a large dataset</tspan></text><line x1="232" y1="100" x2="300" y2="100" stroke="#AAA9BB" stroke-width="2" marker-end="url(#ahAAA9BB)"/><rect x="305.0" y="65.0" width="190" height="70" rx="12" fill="#2C2B40" stroke="#91C7A5" stroke-width="2"/><text x="400" y="96.75" font-size="13" fill="#F1EFF7" text-anchor="middle" font-weight="400"><tspan x="400" dy="0">network with same</tspan><tspan x="400" dy="15.6">input type as your app</tspan></text><line x1="496" y1="100" x2="560" y2="100" stroke="#AAA9BB" stroke-width="2" marker-end="url(#ahAAA9BB)"/><rect x="575.0" y="65.0" width="190" height="70" rx="12" fill="#2C2B40" stroke="#E89BB5" stroke-width="2"/><text x="670" y="96.75" font-size="13" fill="#F1EFF7" text-anchor="middle" font-weight="400"><tspan x="670" dy="0">2. Further train on</tspan><tspan x="670" dy="15.6">your own data</tspan></text><rect x="185.0" y="187.0" width="230" height="56" rx="12" fill="#2C2B40" stroke="#EAC477" stroke-width="2"/><text x="300" y="212.0" font-size="12" fill="#F1EFF7" text-anchor="middle" font-weight="400"><tspan x="300" dy="0">i) change output layer parameters</tspan><tspan x="300" dy="14.399999999999999">(fine tuning)</tspan></text><rect x="465.0" y="187.0" width="230" height="56" rx="12" fill="#2C2B40" stroke="#EAC477" stroke-width="2"/><text x="580" y="219.2" font-size="12" fill="#F1EFF7" text-anchor="middle" font-weight="400"><tspan x="580" dy="0">ii) train all parameters</tspan></text><line x1="670" y1="136" x2="600" y2="186" stroke="#EAC477" stroke-width="2" marker-end="url(#ahEAC477)"/><line x1="640" y1="136" x2="330" y2="186" stroke="#EAC477" stroke-width="2" marker-end="url(#ahEAC477)"/></svg>