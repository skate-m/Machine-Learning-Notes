<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" font-family="Nunito,'Segoe UI',Helvetica,Arial,sans-serif" role="img" aria-labelledby="t d"><title id="t">Information gain example: splitting on ear shape</title><desc id="d">10 animals at the root (5 cats, 5 dogs) split by ear shape into pointy (4 cats, 1 dog) and floppy (1 cat, 4 dogs).</desc><defs><marker id="ahAAA9BB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#AAA9BB"/></marker></defs><rect width="760" height="420" rx="16" fill="#171821"/><rect x="215.0" y="28.0" width="330" height="100" rx="12" fill="#2C2B40" stroke="#A78BFA" stroke-width="2"/><text x="380" y="82.9" font-size="14" fill="#F1EFF7" text-anchor="middle" font-weight="400"><tspan x="380" dy="0"></tspan></text><polygon points="332,40 342,58.0 322,58.0" fill="#EAC477" stroke="#EAC477" stroke-width="1"/><polygon points="356,40 366,58.0 346,58.0" fill="#EAC477" stroke="#EAC477" stroke-width="1"/><polygon points="380,40 390,58.0 370,58.0" fill="#EAC477" stroke="#EAC477" stroke-width="1"/><polygon points="404,40 414,58.0 394,58.0" fill="#EAC477" stroke="#EAC477" stroke-width="1"/><polygon points="428,40 438,58.0 418,58.0" fill="#EAC477" stroke="#EAC477" stroke-width="1"/><rect x="323" y="71" width="18" height="18" rx="2" fill="#E89BB5" stroke="#E89BB5" stroke-width="1"/><rect x="347" y="71" width="18" height="18" rx="2" fill="#E89BB5" stroke="#E89BB5" stroke-width="1"/><rect x="371" y="71" width="18" height="18" rx="2" fill="#E89BB5" stroke="#E89BB5" stroke-width="1"/><rect x="395" y="71" width="18" height="18" rx="2" fill="#E89BB5" stroke="#E89BB5" stroke-width="1"/><rect x="419" y="71" width="18" height="18" rx="2" fill="#E89BB5" stroke="#E89BB5" stroke-width="1"/><text x="380" y="24.55" font-size="13" fill="#AAA9BB" text-anchor="middle" font-weight="400"><tspan x="380" dy="0">root node: 10 examples</tspan></text><text x="380" y="122.9" font-size="14" fill="#EAC477" text-anchor="middle" font-weight="400"><tspan x="380" dy="0">p1(root) = 5/10 = 0.5</tspan></text><line x1="300" y1="132" x2="190" y2="205" stroke="#AAA9BB" stroke-width="2" marker-end="url(#ahAAA9BB)"/><line x1="460" y1="132" x2="570" y2="205" stroke="#AAA9BB" stroke-width="2" marker-end="url(#ahAAA9BB)"/><text x="215" y="164.55" font-size="13" fill="#EAC477" text-anchor="middle" font-weight="400"><tspan x="215" dy="0">Pointy</tspan></text><text x="545" y="164.55" font-size="13" fill="#EAC477" text-anchor="middle" font-weight="400"><tspan x="545" dy="0">Floppy</tspan></text><rect x="55.0" y="215.0" width="270" height="100" rx="12" fill="#2C2B40" stroke="#91C7A5" stroke-width="2"/><text x="190" y="269.9" font-size="14" fill="#F1EFF7" text-anchor="middle" font-weight="400"><tspan x="190" dy="0"></tspan></text><polygon points="142,234 152,252.0 132,252.0" fill="#EAC477" stroke="#EAC477" stroke-width="1"/><polygon points="166,234 176,252.0 156,252.0" fill="#EAC477" stroke="#EAC477" stroke-width="1"/><polygon points="190,234 200,252.0 180,252.0" fill="#EAC477" stroke="#EAC477" stroke-width="1"/><polygon points="214,234 224,252.0 204,252.0" fill="#EAC477" stroke="#EAC477" stroke-width="1"/><rect x="229" y="235" width="18" height="18" rx="2" fill="#E89BB5" stroke="#E89BB5" stroke-width="1"/><text x="190" y="329.9" font-size="14" fill="#EAC477" text-anchor="middle" font-weight="400"><tspan x="190" dy="0">p1(left) = 4/5     w(left) = 5/10</tspan></text><rect x="435.0" y="215.0" width="270" height="100" rx="12" fill="#2C2B40" stroke="#E89BB5" stroke-width="2"/><text x="570" y="269.9" font-size="14" fill="#F1EFF7" text-anchor="middle" font-weight="400"><tspan x="570" dy="0"></tspan></text><polygon points="522,234 532,252.0 512,252.0" fill="#EAC477" stroke="#EAC477" stroke-width="1"/><rect x="537" y="235" width="18" height="18" rx="2" fill="#E89BB5" stroke="#E89BB5" stroke-width="1"/><rect x="561" y="235" width="18" height="18" rx="2" fill