name: Generate assets and validate site

on:
  push:
    branches: [main]
    paths:
      - "scripts/make_diagrams.py"
      - "scripts/make_figures.py"
      - ".github/workflows/generate-assets.yml"

permissions:
  contents: write

jobs:
  generate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy matplotlib mkdocs-material
      - name: Generate diagrams and figures
        run: |
          python scripts/make_diagrams.py
          python scripts/make_figures.py
      - name: Build documentation site
        run: bash scripts/serve_site.sh build
      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/diagrams/*.svg assets/figures/*.png
          if ! git diff --cached --quiet; then
            git commit -m "Generate diagrams and figures"
            git push origin HEAD:main
          fi
