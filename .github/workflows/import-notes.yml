name: One-time notes import

on:
  push:
    branches:
      - import-notes
    paths:
      - '.repo-import/ml-notes.zip.gz'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Import repository files
        env:
          IMPORT_BRANCH: import-notes
        run: |
          git fetch origin "$IMPORT_BRANCH"
          git show "origin/$IMPORT_BRANCH:.repo-import/ml-notes.zip.gz" > /tmp/ml-notes.zip.gz
          gzip -dc /tmp/ml-notes.zip.gz > /tmp/ml-notes.zip
          mkdir -p /tmp/ml-notes-unpacked
          unzip -q /tmp/ml-notes.zip -d /tmp/ml-notes-unpacked
          test -f /tmp/ml-notes-unpacked/machine-learning-notes/README.md

          rm -rf 03-unsupervised-learning 04-recommendation-and-reinforcement-learning
          cp -a /tmp/ml-notes-unpacked/machine-learning-notes/. .
          find . -type f -name '.gitkeep' -delete
          rm -rf .repo-import
          rm -f .github/workflows/import-notes.yml

          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Import structured Machine Learning notes"
          git push origin HEAD:main
          git push origin --delete "$IMPORT_BRANCH" || true
